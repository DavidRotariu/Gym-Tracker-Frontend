name: Deploy Frontend to EC2 (ECR + SSM)

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy-ec2-ssm.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: prod-frontend-ec2-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy via SSM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      FRONTEND_ENV_SSM_PARAM: ${{ vars.FRONTEND_ENV_SSM_PARAM }}
      APP_CONTAINER_NAME: ${{ vars.APP_CONTAINER_NAME }}
      APP_PORT: ${{ vars.APP_PORT }}
      BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
      NEXT_PUBLIC_BASE_URL: ${{ vars.NEXT_PUBLIC_BASE_URL }}
      AUTH_COOKIE_NAME: ${{ vars.AUTH_COOKIE_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment inputs
        shell: bash
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          REQUIRED_VARS=(
            AWS_REGION
            ECR_REPOSITORY
            EC2_INSTANCE_ID
            FRONTEND_ENV_SSM_PARAM
            BACKEND_BASE_URL
            NEXT_PUBLIC_BASE_URL
            AUTH_COOKIE_NAME
          )

          for name in "${REQUIRED_VARS[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing variable::Repository variable ${name} is required."
              exit 1
            fi
          done

          if [ -z "${AWS_DEPLOY_ROLE_ARN:-}" ]; then
            echo "::error title=Missing secret::Repository secret AWS_DEPLOY_ROLE_ARN is required."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-actions-ec2-deploy
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Prepare image metadata
        id: image-meta
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_TAG="sha-${GITHUB_SHA::12}"
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          install: true

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          builder: ${{ steps.buildx.outputs.name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.image-meta.outputs.image_uri }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:prod-latest
          provenance: false
          build-args: |
            BACKEND_BASE_URL=${{ env.BACKEND_BASE_URL }}
            NEXT_PUBLIC_BASE_URL=${{ env.NEXT_PUBLIC_BASE_URL }}
            AUTH_COOKIE_NAME=${{ env.AUTH_COOKIE_NAME }}

      - name: Deploy on EC2 via SSM
        id: ssm-deploy
        shell: bash
        run: |
          set -euo pipefail

          APP_NAME="${APP_CONTAINER_NAME:-gym-tracker-frontend}"
          APP_PORT_VALUE="${APP_PORT:-3000}"
          IMAGE_URI="${{ steps.image-meta.outputs.image_uri }}"
          ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"

          DEPLOY_SCRIPT=$(cat <<EOF
          set -euo pipefail

          AWS_REGION="${AWS_REGION}"
          ECR_REGISTRY="${ECR_REGISTRY}"
          IMAGE_URI="${IMAGE_URI}"
          FRONTEND_ENV_SSM_PARAM="${FRONTEND_ENV_SSM_PARAM}"
          APP_CONTAINER_NAME="${APP_NAME}"
          APP_PORT="${APP_PORT_VALUE}"
          ENV_DIR="/opt/gym-tracker/frontend"
          ENV_FILE="/opt/gym-tracker/frontend/.env.production"

          mkdir -p "\${ENV_DIR}"
          aws ssm get-parameter \
            --name "\${FRONTEND_ENV_SSM_PARAM}" \
            --with-decryption \
            --query 'Parameter.Value' \
            --output text > "\${ENV_FILE}"
          chmod 600 "\${ENV_FILE}"

          aws ecr get-login-password --region "\${AWS_REGION}" | docker login --username AWS --password-stdin "\${ECR_REGISTRY}"

          PREV_IMAGE="\$(docker inspect --format='{{.Config.Image}}' "\${APP_CONTAINER_NAME}" 2>/dev/null || true)"

          docker pull "\${IMAGE_URI}"
          docker rm -f "\${APP_CONTAINER_NAME}" 2>/dev/null || true

          docker run -d \
            --name "\${APP_CONTAINER_NAME}" \
            --restart unless-stopped \
            --env-file "\${ENV_FILE}" \
            -p "127.0.0.1:\${APP_PORT}:3000" \
            "\${IMAGE_URI}"

          HEALTH_OK=0
          for i in \$(seq 1 30); do
            if curl -fsS "http://127.0.0.1:\${APP_PORT}/" > /dev/null; then
              HEALTH_OK=1
              break
            fi
            sleep 2
          done

          if [ "\${HEALTH_OK}" -eq 1 ]; then
            echo "Deployment health check passed"
            exit 0
          fi

          echo "Deployment health check failed. Attempting rollback..."
          docker logs --tail 100 "\${APP_CONTAINER_NAME}" || true

          if [ -n "\${PREV_IMAGE}" ]; then
            docker pull "\${PREV_IMAGE}" || true
            docker rm -f "\${APP_CONTAINER_NAME}" 2>/dev/null || true
            docker run -d \
              --name "\${APP_CONTAINER_NAME}" \
              --restart unless-stopped \
              --env-file "\${ENV_FILE}" \
              -p "127.0.0.1:\${APP_PORT}:3000" \
              "\${PREV_IMAGE}"
            echo "Rollback started with previous image \${PREV_IMAGE}"
          else
            echo "No previous image available for rollback"
          fi

          exit 1
          EOF
          )

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --comment "Deploy frontend ${GITHUB_SHA}" \
            --parameters "$(jq -nc --arg script "${DEPLOY_SCRIPT}" '{commands: [$script]}')" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"

          aws ssm wait command-executed \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}"

      - name: Print SSM command output
        if: always() && steps.ssm-deploy.outputs.command_id != ''
        shell: bash
        run: |
          set -euo pipefail

          COMMAND_ID="${{ steps.ssm-deploy.outputs.command_id }}"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query "Status" \
            --output text)

          echo "SSM command status: ${STATUS}"
          echo "----- STDOUT -----"
          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query "StandardOutputContent" \
            --output text || true

          echo "----- STDERR -----"
          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query "StandardErrorContent" \
            --output text || true

          if [ "${STATUS}" != "Success" ]; then
            echo "::error title=Deployment failed::SSM command did not finish successfully."
            exit 1
          fi
